services:
  db:
    image: mysql:26.10.0-oraclelinux9
    container_name: mysql_server
    restart: unless-stopped
    ports:
    - 3306:3306
    env_file:
    - mysql.env
    environment:
      MYSQL_DATABASE: snippetbox
      MYSQL_USER: web
    volumes:
    - mysql_data:/var/lib/mysql
    - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
